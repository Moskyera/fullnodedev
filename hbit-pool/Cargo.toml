[package]
name = "hbit-pool"
version = "0.1.0"
edition = "2024"
description = "HBIT: the Hacash mining pool this project ships. Share accounting, PPLNS payout splitting and on-chain settlement, plus the feasibility spikes it grew out of."

# The pool daemon: serves work, validates shares, submits blocks, settles.
[[bin]]
name = "hbit-pool-server"
path = "src/server.rs"

# Manual settlement, run by hand while the server is stopped.
[[bin]]
name = "hbit-pool-payout"
path = "src/payout.rs"

# CPU worker used to soak-test the pool protocol.
[[bin]]
name = "hbit-test-miner"
path = "src/miner.rs"

# P1 feasibility spikes. These really are spikes, so they keep the word.
[[bin]]
name = "hbit-pool-spike"
path = "src/main.rs"

[[bin]]
name = "hbit-settle-spike"
path = "src/settle.rs"

[[bin]]
name = "hbit-asert-check"
path = "src/asert_check.rs"

[dependencies]
field    = { path = "../field" }
basis    = { path = "../basis" }
protocol = { path = "../protocol" }
mint     = { path = "../mint" }
sys      = { path = "../sys" }
x16rs    = { path = "../x16rs" }
reqwest  = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
serde_json = "1.0"
hex = "0.4.3"
getrandom = "0.3.2"
num-bigint = "0.4.6"
# Cross-process advisory file lock: exactly one process may settle a wallet.
fs2 = "0.4.3"
# Encryption at rest for the pool wallet key (same primitives as sdk/keystore).
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = "0.5.3"
zeroize = "1.9.0"

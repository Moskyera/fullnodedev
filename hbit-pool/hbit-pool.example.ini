; ============================================================================
; HBIT pool - ARGUMENT WORKSHEET
; ----------------------------------------------------------------------------
; READ THIS FIRST: no program reads this file.
;
; hbit-pool-server and hbit-pool-payout take every setting as an ARGUMENT on
; the command line, in a fixed order. There is no config file. This worksheet
; exists so you can write your answers down once, in one place, and then read
; the command off the bottom of it.
;
; So filling this in and then starting the server with no arguments does NOT
; work. It fails loudly rather than quietly: the server refuses to start
; without the `chain` argument instead of guessing one, so you get an error and
; nothing is lost.
;
; Nothing here is filled in for you. Every blank is a choice only you can make,
; and one of them decides where real money is held. A value shipped by somebody
; else is a value you did not choose.
;
; Never write the wallet passphrase in this file, or in any file next to the
; wallet key. See the PASSPHRASE section at the bottom for where it goes.
;
; The full runbook is POOL-OPERATOR.md, in this same folder.
; ============================================================================


; ============================================================================
; hbit-pool-server
;   hbit-pool-server <node> <wallet_file> <listen> <share_bits> <chain> [settle_secs]
; ============================================================================
[hbit-pool-server]

; ARGUMENT 1: node
; Base URL of YOUR OWN synced Hacash fullnode RPC. The pool asks it for block
; templates, submits found blocks to it, and pays miners through it. It has to
; be a node you control: whoever runs the node decides what your pool mines and
; sees every payout before it is signed.
; The fullnode in this package listens on port 8080 (that is `listen` under
; [server] in hacash.config.ini), so on the same PC the answer is
;   http://127.0.0.1:8080
; If you leave the argument off entirely the built-in default is
; http://127.0.0.1:8088, which is NOT the port this package configures.
node =

; ARGUMENT 2: wallet_file
; Path to the pool's own wallet key file. If the file does not exist the pool
; CREATES a new wallet there on first start and mines into it. That one file
; controls every coin the pool has taken in and not yet paid out. Back it up,
; and read the WALLET section of README-POOL.txt before you start.
; Put it somewhere you back up, not in a temporary folder. A bare name like
;   pool-wallet.key
; means "next to the program", which is fine as long as that folder is backed
; up. If you leave the argument off, that bare name is the built-in default.
; The pool also writes two files beside it, and they belong with it in any
; backup:
;   <wallet_file>.state.json   share accounting and the pending-payout ledger
;   <wallet_file>.settle.lock  the lock described in ARGUMENT 3 of the payout
;                              section below
wallet_file =

; ARGUMENT 3: listen
; Address and port this pool serves miners on, as <ip>:<port>.
;   127.0.0.1:9777   only this PC can mine here (use this to test)
;   0.0.0.0:9777     any machine that can reach this PC can mine here
; 0.0.0.0 is what a real pool needs, and it is also what exposes this program
; to the internet. Do not open a port to it until you have read POOL-OPERATOR.md
; and the wallet is encrypted and backed up.
; Built-in default if you leave the argument off: 127.0.0.1:9777
listen =

; ARGUMENT 4: share_bits
; How many powers of two easier a share is than a real network block. Must be
; between 18 and 40; the server exits with an explanation outside that range.
; 24 suits GPU miners and is the right answer unless you have measured
; otherwise, so it is pre-filled here with the same value the program uses when
; the argument is left off.
share_bits = 24

; ARGUMENT 5: chain
; REQUIRED. There is no default, because a pool running the wrong difficulty
; rule mines work the node throws away forever without ever saying so.
;   mainnet                            real Hacash mainnet
;   testnet                            a testnet on the documented 288 / 10s pair
;   testnet:<adjust_blocks>:<seconds>  a testnet configured with any other pair
; The server proves your answer against the node's own current block before it
; serves any work, and refuses to start if the two disagree.
chain =

; ARGUMENT 6: settle_secs (optional)
; Seconds between automatic payout runs. Pre-filled with the same value the
; program uses when the argument is left off.
settle_secs = 300


; ============================================================================
; hbit-pool-payout
;   hbit-pool-payout <pool_base> <node> <chain> [wallet_file] [reserve_units] [dust_units] [--commit]
;
; Manual settlement, for when the server is STOPPED. Both programs take an
; exclusive lock on the wallet, so this tool refuses to run while the server is
; up. That refusal is protecting your money: see POOL-OPERATOR.md section 2.
; ============================================================================
[hbit-pool-payout]

; ARGUMENT 1: pool_base
; Base URL of the pool server's own HTTP port, so the tool can read the share
; window from it. With the server stopped it falls back to the accounting file
; next to the wallet, which is the normal case for a manual payout.
; This is your ARGUMENT 3 above, as a URL, for example http://127.0.0.1:9777
; Built-in default if left off: http://127.0.0.1:9777
pool_base =

; ARGUMENT 2: node
; The same fullnode RPC URL as ARGUMENT 1 of the server section.
node =

; ARGUMENT 3: chain
; The same value as ARGUMENT 5 of the server section. Required here too.
chain =

; ARGUMENT 4: wallet_file (optional)
; The same wallet file as ARGUMENT 2 of the server section. Point this at a
; different file and you are paying out of a different wallet.
wallet_file =

; ARGUMENT 5: reserve_units (optional)
; Kept back in the pool wallet so it can always fund the network fee on a
; payout transaction, in whole units of 0.1 HAC. Not a fee and not skimmed: a
; later cycle pays out whatever of it is no longer needed. Pre-filled with the
; value the program uses when the argument is left off (5 = 0.5 HAC).
reserve_units = 5

; ARGUMENT 6: dust_units (optional)
; Smallest payout a cycle will include, in whole units of 0.1 HAC. A miner
; whose share rounds below this is paid nothing that cycle and the money stays
; in the pool wallet for the next one. Pre-filled with the built-in value
; (1 = 0.1 HAC).
dust_units = 1

; --commit
; NOT a numbered argument: write it anywhere on the command line. Without it
; the tool is a dry run that prints the planned split and pays nothing. Read
; the dry run first, every time.


; ============================================================================
; PASSPHRASE (an environment variable, never a line in this file)
; ----------------------------------------------------------------------------
; With a passphrase set, the wallet key file is stored encrypted with Argon2id
; and AES-256-GCM, so a stolen backup or an old disk is inert without it. With
; no passphrase set the key file is plaintext and the pool warns about it on
; every start.
;
; Set ONE of these in the shell you start the pool from, minimum 8 characters:
;   HBIT_WALLET_PASSWORD        the passphrase itself
;   HBIT_WALLET_PASSWORD_FILE   path to a file holding it, for services that
;                               cannot carry secrets in the environment
; HBIT_WALLET_PASSWORD wins if both are set.
;
; Windows PowerShell, in the window you are about to start the pool in:
;   $env:HBIT_WALLET_PASSWORD = "the passphrase you wrote down"
; Linux:
;   export HBIT_WALLET_PASSWORD='the passphrase you wrote down'
;
; The passphrase and the key file are two halves of one key and NEITHER half
; works alone. Back them up together, or the coins are gone: there is no reset
; and no recovery.


; ============================================================================
; THE COMMAND (fill the blanks above in, then read it off here)
; ----------------------------------------------------------------------------
; Windows PowerShell, from the folder holding hbit-pool-server.exe:
;   $env:HBIT_WALLET_PASSWORD = "<your passphrase>"
;   .\hbit-pool-server.exe <node> <wallet_file> <listen> <share_bits> <chain>
;
; Linux, from the folder holding hbit-pool-server:
;   export HBIT_WALLET_PASSWORD='<your passphrase>'
;   ./hbit-pool-server <node> <wallet_file> <listen> <share_bits> <chain>
;
; A manual payout, with the server stopped, dry run first:
;   .\hbit-pool-payout.exe <pool_base> <node> <chain> <wallet_file>
; then, only if the printed split is right:
;   .\hbit-pool-payout.exe <pool_base> <node> <chain> <wallet_file> --commit
; ============================================================================

; ============================================================================
; HAC block miner (poworker) - MAINNET, OpenCL GPU
; ----------------------------------------------------------------------------
; Copy next to poworker.exe as:  poworker.config.ini
;
; Connects to your local mainnet fullnode's miner API (the node started with
; hacash.config.mainnet.ini, with [miner] enable = true and YOUR OWN reward
; address). The node must be running and syncing before mining is productive.
;
; HONEST HASHRATE NOTE: the MH/s shown while mining reflects the X16RS round
; count at the CURRENT chain height. On mainnet that is 16 rounds. To measure
; the mainnet-equivalent rate WITHOUT waiting for a full sync, run the built-in
; repeat=16 benchmark:  set HACASH_REPEAT16_BENCH_SECONDS=30 then run poworker.
; ============================================================================

connect = 127.0.0.1:8080
; 0 = let the worker pick the CPU-assist thread count
supervene = 0
nonce_max = 4294967295
notice_wait = 45

[efficiency]
; mode: eco | profit | max   (profit = best HAC per kWh)
mode = profit
power_cost_kwh = 0.15
; Set gpu_watts / hac_price to your own numbers to get profit estimates.
gpu_watts = 0
cpu_watts_per_thread = 8
hac_price = 0
dynamic_supervene = false
supervene_min = 0
supervene_max = 0
oom_fallback = true
max_temp_c = 0
throttle_work_groups = 32
thermal_gpu_index = 0
idle_start_hour = 255
idle_end_hour = 255
pause_if_unprofitable = false
; Set > 0 to run Auto Tune on startup; 0 = mine.
benchmark_seconds = 0
stats_file = miner-stats.json

[gpu]
use_opencl = true
use_cuda = false
; HAC is GPU-first; CPU-assist off. Set true only if you also want the CPU to
; contribute HAC hashes alongside the GPU.
cpu_assist = false
; Run Auto Tune to replace these for your specific card.
; Presets: amd_eco | amd_profit | amd_balanced | amd_performance | amd_max
gpu_profile = amd_profit
platform_id = 0
device_ids = 0
; Flat release layout: the kernels ship in x16rs/opencl/ next to the exe.
opencl_dir = x16rs/opencl/
work_groups = 64
local_size = 256
unit_size = 64
debug = 0

; ============================================================================
; HACD diamond miner (diaworker) - MAINNET, CPU-ONLY
; ----------------------------------------------------------------------------
; Official design: diamonds are CPU / full-node mining. There is no GPU path and
; no diamond pool. The worker ignores any [gpu] use_opencl / use_cuda keys.
;
; Prerequisites:
;   1. Mainnet fullnode synced (or syncing) with:
;        [diamondminer] enable = true
;        reward + bid_password + bid_min/max/step set
;   2. Copy this file next to diaworker.exe as:  diaworker.config.ini
;   3. connect = host:port of the node miner API (default 127.0.0.1:8080)
; ============================================================================

connect = 127.0.0.1:8080
; Optional if the node has [server] api_token =
; api_token =

; CPU worker threads for diamond PoW.
; Prefer leaving room for the fullnode (e.g. cores - 2).
supervene = 6

[efficiency]
mode = profit
power_cost_kwh = 0.15
; HACD has no GPU draw in this worker
gpu_watts = 0
cpu_watts_per_thread = 8
hac_price = 0
dynamic_supervene = true
supervene_min = 1
supervene_max = 0
idle_start_hour = 255
idle_end_hour = 255
pause_if_unprofitable = false
benchmark_seconds = 0
stats_file = miner-stats-hacd.json

; NOTE: [gpu] below is ignored for HACD (CPU-only). Kept only so old presets
; do not confuse operators - do not set use_opencl=true expecting GPU diamonds.
[gpu]
use_opencl = false
use_cuda = false
cpu_assist = false

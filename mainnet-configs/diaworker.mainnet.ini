; ============================================================================
; HACD diamond miner (diaworker) - MAINNET, CPU-ONLY
; ----------------------------------------------------------------------------
; Official design: diamonds are CPU / full-node mining. There is no GPU path and
; no diamond pool. The worker ignores any [gpu] use_opencl / use_cuda keys.
;
; Prerequisites:
;   1. Mainnet fullnode synced (or syncing) with:
;        [diamondminer] enable = true
;        reward + bid_password + bid_min/max/step set
;   2. Copy this file next to diaworker.exe as:  diaworker.config.ini
;   3. connect = host:port of the node miner API (default 127.0.0.1:8080)
; ============================================================================

connect = 127.0.0.1:8080
; Optional if the node has [server] api_token =
; api_token =

; CPU worker threads for diamond PoW.
;
; 0 = fit this machine: the worker counts the logical CPUs it actually has and
; takes all of them but two, leaving one for the fullnode and one for the
; desktop or a co-running GPU miner's feed thread. On a 16-core / 32-thread CPU
; that is 30 threads and about 1.44 MH/s; this line used to say 6, which is
; 0.32 MH/s, or 22% of the machine. A file cannot count cores it has never seen,
; so it does not try.
;
; Set a number here only to take LESS than that. A number is obeyed exactly.
supervene = 0

[efficiency]
mode = profit
power_cost_kwh = 0.15
; HACD has no GPU draw in this worker
gpu_watts = 0
cpu_watts_per_thread = 8
hac_price = 0
; dynamic_supervene rebalances CPU threads against a GPU in the same process by
; watching the GPU/CPU nonce ratio. HACD has no GPU, so there is nothing to
; balance and the ratio is permanently 0. It also does nothing at all unless
; supervene_max > 0, which is why this said true next to a 0 cap and had no
; effect whatsoever. False is the honest value.
dynamic_supervene = false
supervene_min = 1
; 0 = no cap. The thread count above is the whole decision.
supervene_max = 0
idle_start_hour = 255
idle_end_hour = 255
pause_if_unprofitable = false
benchmark_seconds = 0
stats_file = miner-stats-hacd.json

; NOTE: [gpu] below is ignored for HACD (CPU-only). Kept only so old presets
; do not confuse operators - do not set use_opencl=true expecting GPU diamonds.
[gpu]
use_opencl = false
use_cuda = false
cpu_assist = false

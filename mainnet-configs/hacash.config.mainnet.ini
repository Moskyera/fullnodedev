; ============================================================================
; Hacash FULLNODE - MAINNET (chain_id 0) + HACD diamond miner settings
; ----------------------------------------------------------------------------
; Real mainnet genesis (hard-asserted in mint/src/genesis/block.rs):
;   000000077790ba2fcdeaef4a4299d9b667135bac577ce204dee8388f1b97f7e6
; Copy next to hacash.exe / fullnode.exe as:  hacash.config.ini
;
; BOTH miners ship OFF and with NO reward address on purpose. A reward address
; you did not type yourself would pay every block reward to whoever owns it,
; permanently, with no error and no way to get it back. Put your own address in
; first, then turn the miner on.
; ============================================================================

[node]
name = rust_node
; Mainnet P2P
listen = 3337
; Official-style boot nodes (rotate over time - update if peers fail)
boots = 54.193.49.59:3337, 182.92.163.225:3337, 54.219.80.127:3337
; MUST be false to join live network (true = isolated local chain)
not_find_nodes = false
fast_sync = false
; Deliberately false, and NOT for the reason first written here. An earlier
; version of this comment claimed fast_sync corrupts the chain. That was wrong:
; a controlled test on 2026-07-28 synced this chain from zero with fast_sync = true
; and reached the tip with no errors at all. The corruption seen on 2026-07-27 was
; repaired by the clean RESYNC, not by the flag, and concluding otherwise was
; reading causation out of one sample with no control.
;
; The real reason to leave it off is what it actually relaxes. fast_sync reaches
; execution through ChainInfo and skips checks: protocol/src/context/context.rs
; trusts a Type3 transaction's declared signers instead of verifying signatures,
; and protocol/src/action/macro.rs runs a lighter action precheck. For a node that
; will serve a pool paying other people, validating every signature is worth more
; than a faster first sync.

[mint]
; Mainnet consensus defaults (do not override difficulty / block time for mainnet)

[server]
enable = true
listen = 8080
bind = 127.0.0.1
; api_token =
diamond_form = true
debug_open = false

; ============================================================================
; HAC - block miner (mainnet). Serves block templates to poworker (GPU/CPU).
; ----------------------------------------------------------------------------
; REQUIRED before you can mine HAC, in this order:
;   1. uncomment "reward" below and put YOUR OWN mainnet address there.
;      It must be a PRIVAKEY address, which is the ordinary kind that starts
;      with "1...". This is the address that gets paid.
;   2. set enable = true
; enable = true with no reward is a deliberate hard startup failure: the node
; prints "[Config Error] [miner] reward is required" and stops. It never falls
; back to a built-in address.
; ============================================================================
[miner]
enable = false
; reward = 1PutYourOwnMainnetAddressHere
message = hacashminer

; ============================================================================
; HACD - diamond miner (mainnet)
; ----------------------------------------------------------------------------
; Diamonds use mainnet PoW: 10 leading '0' + 6-char name (DMD_L=10, DMD_M=16).
; Mints only land in blocks whose height % 5 == 0.
; diaworker is CPU-only (GPU keys ignored).
;
; enable = false -> node starts without diamond API (safe default)
; enable = true  -> MUST set reward + bid_password + bid_min/max/step
;                   or the node will refuse to start.
; ============================================================================
[diamondminer]
enable = false
; Diamond reward address (PRIVAKEY "1..." - who receives the diamond)
; reward = 1PutYourOwnMainnetAddressHere
; Password of the account that signs diamond-bid txs (it must hold HAC to pay
; the bids). It must not be the well known "123456": that private key is public
; and the node refuses to start with it.
; bid_password = change-me-to-your-wallet-password
; Auto-bid band in plain HAC (decimal): 1 = 1 HAC, 0.5 = half a HAC.
;   bid_min  = lowest bid considered
;   bid_max  = highest auto-bid
;   bid_step = increment when raising a bid (0.0001 HAC is the code floor)
bid_min = 1
bid_max = 31
bid_step = 0.5

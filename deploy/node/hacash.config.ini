; Full node for the HBIT pool, running in a container.
;
; Mining is OFF here. This node's job is to hold the chain and answer the pool's
; template and submit requests. The mining happens on other people's hardware.
;
; ============================================================================
; SET `api_token` BELOW BEFORE THE FIRST START, to any long random string.
; ============================================================================
;
; This node binds 0.0.0.0 because the pool runs in a different container and
; reaches it across the compose network. The node REFUSES to serve its API at
; all on a non-loopback bind with an empty token: see
; server/src/server/server.rs, which prints one line and returns from the listen
; task. The process then keeps running and keeps syncing the chain, looking
; healthy in every way except that nothing is listening on port 8080. The
; compose healthcheck never passes, the pool waits on it for ever, and the only
; symptom is a pool that never starts.
;
; An earlier version of this file said 0.0.0.0 "is correct INSIDE a container"
; and set no token. That was wrong: it is not correct anywhere, and this whole
; deployment could not come up.
;
; The pool sends this token on every request. Give it to the pool through the
; environment variable HBIT_NODE_API_TOKEN - never as a command-line argument,
; which is visible in `ps` and in `docker inspect` to anyone on the box.
;
; The token is not a substitute for the network boundary. The compose file
; still publishes no port for this service, so the API is reachable only from
; the pool container; the token is what stops anything else that lands on that
; network from driving the miner API.

[node]
listen = 3337
boots = 54.193.49.59:3337, 182.92.163.225:3337, 54.219.80.127:3337
not_find_nodes = false
fast_sync = false
; Deliberately false, and NOT for the reason first written here. An earlier
; version of this comment claimed fast_sync corrupts the chain. That was wrong:
; a controlled test on 2026-07-28 synced this chain from zero with fast_sync = true
; and reached the tip with no errors at all. The corruption seen on 2026-07-27 was
; repaired by the clean RESYNC, not by the flag, and concluding otherwise was
; reading causation out of one sample with no control.
;
; The real reason to leave it off is what it actually relaxes. fast_sync reaches
; execution through ChainInfo and skips checks: protocol/src/context/context.rs
; trusts a Type3 transaction's declared signers instead of verifying signatures,
; and protocol/src/action/macro.rs runs a lighter action precheck. For a node that
; will serve a pool paying other people, validating every signature is worth more
; than a faster first sync.

; No [mint] section. chain_id defaults to 0, which is mainnet.

[server]
enable = true
listen = 8080
bind = 0.0.0.0
; Replace with a long random string, and give the SAME value to the pool as
; HBIT_NODE_API_TOKEN. Leave it empty and this node will not serve at all.
api_token = CHANGE_ME_TO_A_LONG_RANDOM_STRING

[miner]
; ============================================================================
; YOU MUST FILL IN `reward` BELOW BEFORE THE FIRST START. Until you do, the node
; REFUSES to start and the pool cannot serve work. That refusal is deliberate:
; an earlier version of this project shipped a config with somebody else's
; address already in it, and anyone who ran it mined into a stranger's wallet.
; There is no default and there will never be one.
; ============================================================================
;
; `enable = true` is what turns on /query/miner/pending and
; /submit/miner/success, which is how the pool gets block templates and submits
; the blocks its miners find. It does NOT make this node mine by itself.
;
; The address below is almost vestigial in a pool setup: the pool pays miners
; from its OWN wallet, so this one only ever receives anything if you point a
; miner straight at this node instead of at the pool. Use an address you
; control anyway, because "almost never" is not "never".
enable = true
reward =
message = hbit-pool-node
